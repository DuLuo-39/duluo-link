[build]
  command = "npm run build && npm run check"
  publish = "public"

[build.environment]
  NODE_VERSION = "24"

[context.production.environment]
  SITE_URL = "https://duluo.link"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
